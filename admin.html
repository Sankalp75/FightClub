<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Admin — Bulk Email</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:rgba(255,255,255,0.9);font-family:'Anton',sans-serif;min-height:100vh;padding:6vw}
h1{font-family:'FightThis','Arial Narrow',sans-serif;letter-spacing:0.1em;text-align:center;font-size:clamp(24px,5vw,48px)}
p.sub{opacity:0.6;text-align:center;margin:1vh 0 4vh;font-size:14px;letter-spacing:0.06em}
#card{max-width:560px;margin:0 auto;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);padding:1.5em}
label{font-family:'FightThis',sans-serif;font-size:12px;letter-spacing:0.14em;opacity:0.7;display:block;margin:1.2em 0 0.4em}
label:first-child{margin-top:0}
input,textarea{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);color:#fff;padding:0.9em 1em;font-family:'Anton',sans-serif;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:rgba(255,255,255,0.35)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
button{margin-top:1.5em;width:100%;font-family:'FightThis',sans-serif;letter-spacing:0.14em;font-size:16px;padding:0.9em;background:#fff;color:#000;border:1px solid #fff;cursor:pointer}
button:disabled{opacity:0.5}
#log{margin-top:1.2em;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;opacity:0.85;min-height:1.2em}
a.back{position:fixed;left:3vw;top:3vh;font-family:'FightThis',sans-serif;letter-spacing:0.12em;background:#fff;color:#000;padding:0.4em 1em;text-decoration:none;border:1px solid #fff;font-size:13px}
</style>
</head>
<body>
<a class="back" href="index.html">Back</a>
<h1>Bulk Email</h1>
<p class="sub">Send one mail to all <code>joins</code> — works on phone</p>
<div id="card">
  <label for="secret">Bulk Secret (BULK_SECRET)</label>
  <input id="secret" type="password" placeholder="••••••••" autocomplete="off">
  <label for="subject">Subject</label>
  <input id="subject" type="text" placeholder="Hustle Club — update" required>
  <label for="body">Message (HTML allowed)</label>
  <textarea id="body" placeholder="<h1>We move</h1><p>Next task...</p> or plain text"></textarea>
  <button id="send">Send to all</button>
  <div id="log"></div>
</div>
<script>
const secretEl = document.getElementById('secret');
const subjectEl = document.getElementById('subject');
const bodyEl = document.getElementById('body');
const logEl = document.getElementById('log');
const btn = document.getElementById('send');
// remember secret locally
secretEl.value = localStorage.getItem('bulk_secret') || '';
secretEl.addEventListener('input', () => localStorage.setItem('bulk_secret', secretEl.value));
btn.addEventListener('click', async () => {
  const secret = secretEl.value.trim();
  const subject = subjectEl.value.trim();
  const body = bodyEl.value.trim();
  if (!secret) return logEl.textContent = 'Enter Bulk Secret';
  if (!subject || !body) return logEl.textContent = 'Subject and message required';
  btn.disabled = true; btn.textContent = 'Sending...'; logEl.textContent = '';
  try {
    const r = await fetch('/api/bulk-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-bulk-secret': secret },
      body: JSON.stringify({ subject, html: body.includes('<') ? body : `<p>${body}</p>`, text: body })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error + (j.detail ? ': '+j.detail : ''));
    logEl.textContent = `Sent ${j.sent}/${j.total} from ${j.from}`;
    logEl.style.color = '#7CFC6B';
  } catch (e) {
    logEl.textContent = 'Failed: ' + e.message;
    logEl.style.color = '#FF6B6B';
  } finally {
    btn.disabled = false; btn.textContent = 'Send to all';
  }
});
</script>
</body>
</html>
