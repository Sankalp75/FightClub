<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #050505;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #050505 url('images/join-bg.jpg') center center / cover no-repeat;
      filter: blur(10px);
      transform: scale(1.05);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.58) 40%, rgba(0,0,0,0.80) 100%);
    }
    header, #form-wrap { position: relative; z-index: 1; }
    #form-wrap {
      max-width: 980px;
      margin: 6vh auto 12vh;
      padding: 0 6vw;
      background: rgba(5,5,5,0.4);
      backdrop-filter: blur(4px);
      border: 3px solid rgba(255,255,255,0.12);
      border-radius: 0;
      outline: 3px solid #171311;
      box-shadow: 8px 8px 0 0 #171311;
    }
    .join-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(220px, 24vw, 300px);
      gap: 3vw;
      align-items: start;
    }
    .face-card {
      background: rgba(255,255,255,0.04);
      border: 3px solid rgba(255,255,255,0.12);
      outline: 3px solid #171311;
      box-shadow: 8px 8px 0 0 #171311;
      padding: 16px;
    }
    .face-card label {
      display: block;
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.7);
      margin-bottom: 0.6em;
    }
    .face-preview {
      aspect-ratio: 1;
      background: #171311;
      border: 1px solid rgba(255,255,255,0.12);
      overflow: hidden;
      margin-bottom: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .face-preview.dragover { border-color: #c00000; }
    .face-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .face-hint {
      font-family: 'Anton', sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
      text-align: center;
      padding: 1em;
      pointer-events: none;
    }
    .face-card input[type="file"] {
      font-family: 'Anton', sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.6);
      width: 100%;
    }
    .face-card input[type="file"]::file-selector-button {
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      background: #fff;
      border: 1px solid #fff;
      color: #000;
      padding: 0.5em 0.9em;
      margin-right: 0.8em;
      cursor: pointer;
    }
    #form-wrap h2 {
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: clamp(20px, 3vw, 36px);
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 3vh;
      color: rgba(255,255,255,0.95);
    }
    #form-wrap p {
      font-family: 'Anton', sans-serif;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 4vh;
      color: rgba(255,255,255,0.55);
    }
    #join-form label {
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.7);
      margin-bottom: -0.4em;
    }
    #join-form {
      display: flex;
      flex-direction: column;
      gap: 1.6em;
    }
    #join-form input, #join-form textarea {
      font-family: 'Anton', sans-serif;
      font-size: 15px;
      letter-spacing: 0.06em;
      padding: 1em 1.2em;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.9);
      outline: none;
      border-radius: 0;
      width: 100%;
      box-sizing: border-box;
    }
    #join-form input:focus, #join-form textarea:focus { border-color: rgba(255,255,255,0.35); }
    #join-form textarea {
      resize: none;
      min-height: unset;
      height: 64px;
      overflow: hidden;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.5;
    }
    #join-form button {
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: clamp(18px, 2vw, 24px);
      letter-spacing: 0.15em;
      padding: 1em 2em;
      background: #fff;
      border: 1px solid #fff;
      color: #000;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      --x: 50%; --y: 50%;
      transform: translateZ(0);
      transition: border-color 0.35s cubic-bezier(0.22,1,0.36,1);
      width: 100%;
    }
    #join-form button::before {
      content: "";
      position: absolute;
      width: 300%;
      aspect-ratio: 1;
      left: var(--x);
      top: var(--y);
      background: #c00000;
      border-radius: 50%;
      z-index: -1;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 2.70s cubic-bezier(0.22,1,0.36,1);
      will-change: transform;
      pointer-events: none;
    }
    #join-form button:hover::before { transform: translate(-50%, -50%) scale(1); }
    #join-form button:hover { border-color: #c00000; color: #000; }
    #join-form button:focus-visible { outline: none; }
    /* ── user box top-right (mirrors #back position) ── */
    #user-box {
      position: fixed;
      right: 3vw;
      top: 3vh;
      z-index: 10;
      display: none;
      align-items: center;
      gap: 0.8em;
      max-width: min(340px, 70vw);
      background: rgba(10,10,10,0.85);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 0.5em 0.6em;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: 'Anton', sans-serif;
      text-align: left;
      color: rgba(255,255,255,0.9);
    }
    #user-box.show { display: flex; }
    #user-box img {
      width: 44px; height: 44px; object-fit: cover; flex: none;
      border: 1px solid rgba(255,255,255,0.3); background: #171311;
    }
    #user-box .uinfo { min-width: 0; }
    #user-box .uname {
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: 14px; letter-spacing: 0.1em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #user-box .ucontact {
      font-size: 11px; letter-spacing: 0.05em; color: rgba(255,255,255,0.55);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* ── profile popup ── */
    #profile-modal {
      position: fixed; inset: 0; z-index: 100;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 4vh 5vw;
    }
    #profile-modal.show { display: flex; }
    #profile-box {
      width: min(520px, 92vw);
      max-height: 88vh; overflow-y: auto;
      background: rgba(10,10,10,0.94);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 2em;
      text-align: center;
    }
    #profile-box img {
      width: 120px; height: 120px; object-fit: cover;
      border: 2px solid rgba(255,255,255,0.3);
      margin-bottom: 1em; background: #171311;
    }
    #profile-box h2 {
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      letter-spacing: 0.12em; font-size: clamp(22px, 3.5vw, 36px);
      color: rgba(255,255,255,0.95); margin-bottom: 0.3em;
      overflow-wrap: anywhere;
    }
    #profile-box .pcontact { font-size: 13px; letter-spacing: 0.06em; color: rgba(255,255,255,0.55); margin-bottom: 1em; overflow-wrap: anywhere; }
    #profile-box .pdialogue {
      font-size: 14px; line-height: 1.7; letter-spacing: 0.04em;
      color: rgba(255,255,255,0.75); margin-bottom: 0.6em; overflow-wrap: anywhere;
    }
    #profile-box .pdate { font-size: 11px; letter-spacing: 0.08em; color: rgba(255,255,255,0.35); margin-bottom: 1.4em; }
    #profile-box .row { display: flex; gap: 0.8em; }
    #profile-close, #profile-logout {
      flex: 1; font-family: 'FightThis', sans-serif; letter-spacing: 0.12em;
      font-size: 14px; padding: 0.8em; cursor: pointer;
    }
    #profile-close { background: #fff; border: 1px solid #fff; color: #000; }
    #profile-logout { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; }
    /* ── returning-user login strip ── */
    #login-strip {
      position: relative; z-index: 1;
      max-width: 980px; margin: 0 auto; padding: 0 6vw;
      display: none;
    }
    #login-strip.show { display: block; }
    #login-strip .inner {
      border: 1px dashed rgba(255,255,255,0.3);
      padding: 1em 1.2em;
      font-size: 13px; letter-spacing: 0.06em; color: rgba(255,255,255,0.65);
      text-align: center;
    }
    #login-strip button {
      font-family: 'FightThis', sans-serif; font-size: 12px; letter-spacing: 0.12em;
      background: #fff; border: 1px solid #fff; color: #000;
      padding: 0.5em 1.2em; margin-left: 0.8em; cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="back">Back</button>
  <button id="user-box" aria-label="Your profile"></button>
  <header>
    <h1>Join</h1>
    <p>No applications. You show up, you prove it. Fill this — not to be chosen, but to be seen. Weak answers get ignored.</p>
  </header>
  <div id="login-strip"><div class="inner">Welcome back, <span id="login-name"></span>.<button id="login-fill" type="button">Fill my details</button></div></div>
  <main id="form-wrap">
    <h2>Step in</h2>
    <div class="join-grid">
      <form id="join-form">
        <label for="alter-ego">Alter Ego</label>
        <input id="alter-ego" type="text" placeholder="Tyler Durden" required>
        <label for="contact">Contact</label>
        <input id="contact" type="email" placeholder="tyler.durden@soap.com" required autocapitalize="off" autocomplete="off" spellcheck="false" inputmode="email" pattern="^[a-z0-9@._-]+$" title="Only lowercase letters, numbers, @ . _ - allowed">
        <label for="dialogue">State Your Dialogue</label>
        <textarea id="dialogue" placeholder="I don't want to die without any scars." required></textarea>
        <button type="submit">Send</button>
      </form>
      <div class="face-card">
        <div class="face-preview" id="face-preview">
          <span class="face-hint">Drop your face<br>or click to add</span>
        </div>
        <label for="face">Your face</label>
        <input id="face" type="file" accept="image/*">
      </div>
    </div>
  </main>
  <div id="profile-modal" aria-hidden="true">
    <div id="profile-box" role="dialog" aria-label="Your profile">
      <img id="p-face" alt="Your face">
      <h2 id="p-name"></h2>
      <div class="pcontact" id="p-contact"></div>
      <div class="pdialogue" id="p-dialogue"></div>
      <div class="pdate" id="p-date"></div>
      <div class="row">
        <button id="profile-close" type="button">Close</button>
        <button id="profile-logout" type="button">Forget me</button>
      </div>
    </div>
  </div>
<script>
// Supabase wiring — replace with your project values from supabase.com -> Project Settings -> API
// 1) SQL to run once in Supabase SQL Editor:
/*
create table joins (
  id bigserial primary key,
  alter_ego text not null,
  contact text not null,
  dialogue text not null,
  created_at timestamptz default now()
);
alter table joins enable row level security;
create policy "allow anon insert" on joins for insert to anon with check (true);
-- extraction via Dashboard needs no extra policy; for API read, add:
-- create policy "allow authenticated read" on joins for select to authenticated using (true);
-- remember-me (contact + dialogue as credentials) needs anon exact-match lookup:
--   alter table joins add column if not exists face text;
--   create policy "allow anon lookup" on joins for select to anon using (true);
*/
const SUPABASE_URL = 'https://afdrdgtcynnotokghvxh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZHJkZ3RjeW5ub3Rva2dodnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDkxMzYsImV4cCI6MjEwNTMyNTEzNn0.3dfMs3vrwvtyYY5QmDKNZxwwm9RlOfAyfBJXaEMN3yk';

// — block capital letters in contact (input + paste) —
const contactEl = document.getElementById('contact');
contactEl.addEventListener('input', () => {
  if (/[A-Z]/.test(contactEl.value)) {
    const s = contactEl.selectionStart, e = contactEl.selectionEnd;
    contactEl.value = contactEl.value.toLowerCase();
    try { contactEl.setSelectionRange(s, e); } catch {}
  }
  if (/^[a-z0-9@._-]+$/.test(contactEl.value) || contactEl.value === '') contactEl.setCustomValidity('');
});
contactEl.addEventListener('beforeinput', e => {
  if (e.data && /[A-Z]/.test(e.data)) e.preventDefault();
});
contactEl.addEventListener('paste', e => {
  const t = (e.clipboardData || window.clipboardData).getData('text');
  if (/[A-Z]/.test(t)) {
    e.preventDefault();
    const s = contactEl.selectionStart, en = contactEl.selectionEnd;
    const lower = t.toLowerCase();
    contactEl.value = contactEl.value.slice(0, s) + lower + contactEl.value.slice(en);
    const p = s + lower.length;
    try { contactEl.setSelectionRange(p, p); } catch {}
    contactEl.dispatchEvent(new Event('input', {bubbles:true}));
  }
});

// — dialogue expands downward, not left —
const dialogueEl = document.getElementById('dialogue');
const autoGrow = () => {
  dialogueEl.style.height = 'auto';
  dialogueEl.style.height = dialogueEl.scrollHeight + 'px';
};
dialogueEl.addEventListener('input', autoGrow);

// — face card: pick or drop an image —
const faceInput = document.getElementById('face');
const facePreview = document.getElementById('face-preview');
let faceData = '';
const showFaceURL = (url) => {
  facePreview.innerHTML = '';
  const img = document.createElement('img');
  img.alt = 'Your face';
  img.src = url;
  facePreview.appendChild(img);
};
const showFace = (file) => {
  if (!file || !file.type.startsWith('image/')) return;
  // downscale so it fits in localStorage + the face column
  const previewURL = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const MAX = 640;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * scale));
    c.height = Math.max(1, Math.round(img.height * scale));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { faceData = c.toDataURL('image/jpeg', 0.72); } catch { faceData = ''; }
    URL.revokeObjectURL(previewURL);
    if (faceData) showFaceURL(faceData);
    else showFaceURL(previewURL);
  };
  img.onerror = () => showFaceURL(previewURL);
  img.src = previewURL;
};
faceInput.addEventListener('change', () => showFace(faceInput.files[0]));
facePreview.addEventListener('click', () => faceInput.click());
['dragenter', 'dragover'].forEach(ev => facePreview.addEventListener(ev, e => {
  e.preventDefault();
  facePreview.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => facePreview.addEventListener(ev, e => {
  e.preventDefault();
  facePreview.classList.remove('dragover');
}));
facePreview.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (!file) return;
  showFace(file);
  const dt = new DataTransfer();
  dt.items.add(file);
  faceInput.files = dt.files;
});

document.getElementById('back').addEventListener('click', () => {
  window.location.href = 'strong_people.html#join-banner';
});
document.getElementById('join-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!contactEl.checkValidity()) { contactEl.reportValidity(); return; }
  if (!/^[a-z0-9@._-]+$/.test(contactEl.value.trim())) {
    contactEl.setCustomValidity('Only lowercase letters, numbers, @ . _ - allowed');
    contactEl.reportValidity();
    contactEl.setCustomValidity('');
    return;
  } else contactEl.setCustomValidity('');
  const btn = e.target.querySelector('button');
  const payload = {
    alter_ego: document.getElementById('alter-ego').value.trim(),
    contact: document.getElementById('contact').value.trim(),
    dialogue: document.getElementById('dialogue').value.trim(),
    face: faceData || null
  };
  if (SUPABASE_URL.includes('YOUR_PROJECT')) {
    alert('Set SUPABASE_URL and SUPABASE_ANON_KEY in join.html first (see comment at top of script).');
    return;
  }
  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = 'Sending...';
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/joins`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=representation'
      },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error(await r.text());
    let saved = null;
    try { const arr = await r.json(); saved = Array.isArray(arr) ? arr[0] : arr; } catch {}
    rememberUser({
      alter_ego: payload.alter_ego,
      contact: payload.contact,
      dialogue: payload.dialogue,
      face: payload.face,
      created_at: (saved && saved.created_at) || new Date().toISOString()
    });
    e.target.reset();
    dialogueEl.style.height = '64px';
    faceData = '';
    facePreview.innerHTML = '<span class="face-hint">Drop your face<br>or click to add</span>';
    faceInput.value = '';
    alert('Seen. We will find you if you mean it.');
  } catch (err) {
    alert('Failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = prev;
  }
});

// ── remember me: contact + dialogue are the credentials ──
const USER_KEY = 'hustle_user';
const userBox = document.getElementById('user-box');
const profileModal = document.getElementById('profile-modal');
const loginStrip = document.getElementById('login-strip');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

function getUser() {
  try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); }
  catch { return null; }
}
function paintUserBox(u) {
  if (!u) { userBox.classList.remove('show'); userBox.innerHTML = ''; return; }
  userBox.innerHTML = `${u.face ? `<img src="${u.face}" alt="">` : ''}
    <span class="uinfo"><span class="uname">${esc(u.alter_ego)}</span><br>
    <span class="ucontact">${esc(u.contact)}</span></span>`;
  userBox.classList.add('show');
}
function fillForm(u) {
  if (!u) return;
  document.getElementById('alter-ego').value = u.alter_ego || '';
  contactEl.value = u.contact || '';
  dialogueEl.value = u.dialogue || '';
  autoGrow();
  if (u.face) { showFaceURL(u.face); faceData = u.face; }
  document.getElementById('form-wrap').scrollIntoView({ behavior: 'smooth' });
}
function rememberUser(u) {
  try {
    localStorage.setItem(USER_KEY, JSON.stringify(u));
    if (u.contact && u.dialogue) {
      localStorage.setItem('hustle_creds', JSON.stringify({ contact: u.contact, dialogue: u.dialogue }));
    }
  } catch {}
  paintUserBox(u);
  loginStrip.classList.remove('show');
}
async function refreshFromServer(contact, dialogue) {
  try {
    const q = `contact=eq.${encodeURIComponent(contact)}&dialogue=eq.${encodeURIComponent(dialogue)}`;
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/joins?${q}&select=alter_ego,contact,dialogue,face,created_at&order=created_at.desc&limit=1`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if (!r.ok) return null;
    const arr = await r.json();
    return arr[0] || null;
  } catch { return null; }
}
function openProfile(u) {
  if (!u) return;
  document.getElementById('p-name').textContent = u.alter_ego || '';
  document.getElementById('p-contact').textContent = u.contact || '';
  document.getElementById('p-dialogue').textContent = u.dialogue || '';
  document.getElementById('p-date').textContent = u.created_at
    ? 'Joined ' + new Date(u.created_at).toLocaleDateString() : '';
  const img = document.getElementById('p-face');
  if (u.face) { img.src = u.face; img.style.display = ''; }
  else img.style.display = 'none';
  profileModal.classList.add('show');
}
userBox.addEventListener('click', () => openProfile(getUser()));
document.getElementById('profile-close').addEventListener('click', () => {
  profileModal.classList.remove('show');
});
profileModal.addEventListener('click', (e) => {
  if (e.target === profileModal) profileModal.classList.remove('show');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') profileModal.classList.remove('show');
});
document.getElementById('profile-logout').addEventListener('click', () => {
  localStorage.removeItem(USER_KEY);
  localStorage.removeItem('hustle_creds');
  paintUserBox(null);
  profileModal.classList.remove('show');
});
document.getElementById('login-fill').addEventListener('click', () => {
  fillForm(getUser());
  loginStrip.classList.remove('show');
});

// on load: show box if remembered, else try silent re-login from saved
// credentials on this browser; offer one-click fill for returning users
(function initUser() {
  const u = getUser();
  if (u) { paintUserBox(u); return; }
  try {
    const raw = localStorage.getItem('hustle_creds');
    if (!raw) return;
    const creds = JSON.parse(raw);
    if (!creds.contact || !creds.dialogue) return;
    refreshFromServer(creds.contact, creds.dialogue).then((row) => {
      if (!row) return;
      rememberUser(row);
      document.getElementById('login-name').textContent = row.alter_ego || row.contact;
      loginStrip.classList.add('show');
    });
  } catch {}
})();
