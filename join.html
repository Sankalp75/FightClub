<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join</title>
  <link href="https://fonts.googleapis.com/css2?family=Trade+Winds&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #050505;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #050505 url('images/join-bg.jpg') center center / cover no-repeat;
      filter: blur(10px);
      transform: scale(1.05);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.58) 40%, rgba(0,0,0,0.80) 100%);
    }
    header, #form-wrap { position: relative; z-index: 1; }
    #form-wrap {
      max-width: 560px;
      margin: 6vh auto 12vh;
      padding: 0 6vw;
      background: rgba(5,5,5,0.4);
      backdrop-filter: blur(4px);
      border: 3px solid rgba(255,255,255,0.12);
      border-radius: 0;
      outline: 3px solid #171311;
      box-shadow: 8px 8px 0 0 #171311;
    }
    #form-wrap h2 {
      font-family: 'Trade Winds', cursive;
      font-size: clamp(32px, 8vw, 64px);
      letter-spacing: 0.15em;
      text-align: center;
      margin-bottom: 2vh;
      color: rgba(255,255,255,0.95);
      text-shadow: 3px 3px 0 #171311;
    }
    #form-wrap p {
      font-family: 'Anton', sans-serif;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 4vh;
      color: rgba(255,255,255,0.55);
    }
    #join-form label {
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.7);
      margin-bottom: -0.4em;
    }
    #join-form {
      display: flex;
      flex-direction: column;
      gap: 1.6em;
    }
    #join-form input, #join-form textarea {
      font-family: 'Anton', sans-serif;
      font-size: 15px;
      letter-spacing: 0.06em;
      padding: 1em 1.2em;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.9);
      outline: none;
      border-radius: 0;
      width: 100%;
      box-sizing: border-box;
    }
    #join-form input:focus, #join-form textarea:focus { border-color: rgba(255,255,255,0.35); }
    #join-form textarea {
      resize: none;
      min-height: unset;
      height: 64px;
      overflow: hidden;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.5;
    }
    #join-form button {
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: clamp(18px, 2vw, 24px);
      letter-spacing: 0.15em;
      padding: 1em 2em;
      background: #fff;
      border: 1px solid #fff;
      color: #000;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      --x: 50%; --y: 50%;
      transform: translateZ(0);
      transition: border-color 0.35s cubic-bezier(0.22,1,0.36,1);
      width: 100%;
    }
    #join-form button::before {
      content: "";
      position: absolute;
      width: 300%;
      aspect-ratio: 1;
      left: var(--x);
      top: var(--y);
      background: #c00000;
      border-radius: 50%;
      z-index: -1;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 2.70s cubic-bezier(0.22,1,0.36,1);
      will-change: transform;
      pointer-events: none;
    }
    #join-form button:hover::before { transform: translate(-50%, -50%) scale(1); }
    #join-form button:hover { border-color: #c00000; color: #000; }
    #join-form button:focus-visible { outline: none; }
  </style>
</head>
<body>
  <button id="back">BACK</button>
  <header>
    <h1>Join</h1>
    <p>No applications. You show up, you prove it. Fill this — not to be chosen, but to be seen. Weak answers get ignored.</p>
  </header>
  <main id="form-wrap">
    <h2>Step in</h2>
    <form id="join-form">
      <label for="alter-ego">Alter Ego</label>
      <input id="alter-ego" type="text" placeholder="Tyler Durden" required>
      <label for="contact">Contact</label>
      <input id="contact" type="email" placeholder="tyler.durden@soap.com" required>
      <label for="dialogue">State Your Dialogue</label>
      <textarea id="dialogue" placeholder="I don't want to die without any scars." required></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
<script>
// Supabase wiring — replace with your project values from supabase.com -> Project Settings -> API
// 1) SQL to run once in Supabase SQL Editor:
/*
create table joins (
  id bigserial primary key,
  alter_ego text not null,
  contact text not null,
  dialogue text not null,
  created_at timestamptz default now()
);
alter table joins enable row level security;
create policy "allow anon insert" on joins for insert to anon with check (true);
-- extraction via Dashboard needs no extra policy; for API read, add:
-- create policy "allow authenticated read" on joins for select to authenticated using (true);
*/
const SUPABASE_URL = 'https://afdrdgtcynnotokghvxh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZHJkZ3RjeW5ub3Rva2dodnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDkxMzYsImV4cCI6MjEwNTMyNTEzNn0.3dfMs3vrwvtyYY5QmDKNZxwwm9RlOfAyfBJXaEMN3yk';

document.getElementById('back').addEventListener('click', () => {
  window.location.href = 'strong_people.html';
});
document.getElementById('join-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const payload = {
    alter_ego: document.getElementById('alter-ego').value.trim(),
    contact: document.getElementById('contact').value.trim(),
    dialogue: document.getElementById('dialogue').value.trim()
  };
  if (SUPABASE_URL.includes('YOUR_PROJECT')) {
    alert('Set SUPABASE_URL and SUPABASE_ANON_KEY in join.html first (see comment at top of script).');
    return;
  }
  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = 'Sending...';
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/joins`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error(await r.text());
    e.target.reset();
    alert('Seen. We will find you if you mean it.');
  } catch (err) {
    alert('Failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = prev;
  }
});
</script>
<script src="script.js"></script>
<div id="mobile-block" aria-hidden="true"><img src="images/instead.jpg" alt=""><p>Instead use your laptop, Noob!</p></div></body>
</html>
