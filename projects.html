<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #050505;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #050505 url('images/projects-bg.jpg') center center / cover no-repeat;
      filter: blur(10px);
      transform: scale(1.05);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.66) 40%, rgba(0,0,0,0.84) 100%);
    }
    header, #grid { position: relative; z-index: 1; }
    #grid .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
      padding: 0 0 2em;
      overflow: hidden;
    }
    #grid .card:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.12); }
    #grid .card .photo {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: center;
      display: block;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    #grid .card .num { margin-top: 1.6em; }
    #grid .card h2, #grid .card p { padding-left: 1.8em; padding-right: 1.8em; }
    #grid .card .by {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.4); margin-bottom: 0.9em;
    }
    #grid .card .meta {
      display: flex; justify-content: center; align-items: center; gap: 0.9em;
      margin-top: 1.2em; padding: 0 1.8em;
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    #grid .card .status {
      border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
      padding: 0.35em 0.8em; color: rgba(255,255,255,0.6);
    }
    #grid .card .status.completed { color: #8fe08f; border-color: rgba(143,224,143,0.4); }
    #grid .card .status.in-progress { color: #ffcf6b; border-color: rgba(255,207,107,0.4); }
    #grid .card .status.locked { color: rgba(255,255,255,0.35); }
    #grid .card .repo {
      font-family: 'FightThis', sans-serif; color: rgba(255,255,255,0.55);
      text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.25);
    }
    #grid .card .repo:hover { color: #c00000; border-color: #c00000; }
    #grid .card { position: relative; }
    .edit-btn {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      font-family: 'FightThis', sans-serif; font-size: 12px; letter-spacing: 0.14em;
      padding: 0.5em 0.9em; cursor: pointer;
      background: rgba(0,0,0,0.72); color: #fff;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 999px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, border-color 0.3s ease;
    }
    #grid .card:hover .edit-btn, .edit-btn:focus-visible { opacity: 1; pointer-events: auto; }
    .edit-btn:hover { border-color: #c00000; color: #c00000; }
  </style>
</head>
<body>
  <button id="back">Back</button>
  <button id="add-btn">Cheers</button>
  <header>
    <h1>Projects</h1>
  </header>
  <main id="grid">
  </main>
  <div id="add-modal" aria-hidden="true">
    <div id="add-box" role="dialog" aria-label="Add your project">
      <h2 id="add-heading">Cheers</h2>
      <p class="sub">One line. One link. No fluff.</p>
      <label for="add-face">Project image</label>
      <div id="add-face-preview">Drop an image<br>or click to add</div>
      <input id="add-face" type="file" accept="image/*" hidden>
      <label for="add-author">Author</label>
      <input id="add-author" type="text" maxlength="40" placeholder="Your name" autocomplete="off">
      <label for="add-title">Project Title</label>
      <input id="add-title" type="text" maxlength="60" placeholder="What are you building?" autocomplete="off">
      <label for="add-status">Status</label>
      <select id="add-status">
        <option value="" selected disabled>Select status</option>
        <option value="completed">Completed</option>
        <option value="in progress">In progress</option>
        <option value="locked">Locked</option>
      </select>
      <label for="add-desc">Description</label>
      <textarea id="add-desc" maxlength="140" placeholder="One line on why this matters."></textarea>
      <label for="add-repo">GitHub Repo</label>
      <input id="add-repo" type="text" maxlength="200" placeholder="https://github.com/you/repo" autocomplete="off">
      <div class="row">
        <button id="add-cancel" type="button">Cancel</button>
        <button id="add-send" type="button">Send</button>
      </div>
      <div id="add-err"></div>
    </div>
  </div>
<script>
// ── Projects board (Supabase: projects table) ──
// Run ONCE in Supabase → SQL Editor (table + policies):
//   create table projects (
//     id bigserial primary key,
//     author text not null,
//     title text not null,
//     status text not null check (status in ('completed', 'in progress', 'locked')),
//     description text not null,
//     repo text not null,
//     face text,
//     owner_token text not null default '', -- sha256(contact + dialogue), kept private
//     owner_tag text not null default '',   -- sha256(owner_token), public "is mine" marker
//     created_at timestamptz default now()
//   );
//   -- existing table from before the face/title/owner columns:
//   alter table projects add column if not exists title text not null default '';
//   alter table projects add column if not exists face text;
//   alter table projects add column if not exists owner_token text not null default '';
//   alter table projects add column if not exists owner_tag text not null default '';
//   alter table projects enable row level security;
//   create policy "allow anon insert" on projects
//     for insert to anon with check (true);
//   create policy "allow anon read" on projects
//     for select to anon using (true);
//   -- ownership: only the logged-in author's token may update
//   create policy "allow owner update" on projects for update to anon
//     using (owner_token = coalesce(current_setting('request.headers', true)::json->>'x-owner-token', ''))
//     with check (owner_token = coalesce(current_setting('request.headers', true)::json->>'x-owner-token', ''));
//   revoke select on public.projects from anon;
//   grant select (id, author, title, status, description, repo, face, owner_tag, created_at) on public.projects to anon;
//   grant insert on public.projects to anon;
//   grant update (author, title, status, description, repo, face) on public.projects to anon;
//   grant usage on sequence public.projects_id_seq to anon;
const SUPABASE_URL = 'https://afdrdgtcynnotokghvxh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZHJkZ3RjeW5ub3Rva2dodnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDkxMzYsImV4cCI6MjEwNTMyNTEzNn0.3dfMs3vrwvtyYY5QmDKNZxwwm9RlOfAyfBJXaEMN3yk';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const grid = document.getElementById('grid');
const modal = document.getElementById('add-modal');
const authorEl = document.getElementById('add-author');
const titleEl = document.getElementById('add-title');
const statusEl = document.getElementById('add-status');
const descEl = document.getElementById('add-desc');
const repoEl = document.getElementById('add-repo');
const errEl = document.getElementById('add-err');
const sendBtn = document.getElementById('add-send');
const headingEl = document.getElementById('add-heading');
const faceInput = document.getElementById('add-face');
const facePreview = document.getElementById('add-face-preview');
const FACE_HINT = 'Drop an image<br>or click to add';
let faceData = '';

// Ownership is the login itself: the same contact + dialogue used on /join
// hashes into the owner key stored on the project. `owner_token` is the
// private bearer value the RLS policy checks; `owner_tag` is a public
// hash-of-hash used only to show Edit on the cards you own.
let editingId = null;
function getUser() {
  try { return JSON.parse(localStorage.getItem('hustle_user') || 'null'); } catch { return null; }
}
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
async function ownerKeys() {
  const u = getUser();
  if (!u || !u.contact || !u.dialogue) return null;
  const token = await sha256(`fightclub:${u.contact}\n${u.dialogue}`);
  return { token, tag: await sha256(`tag:${token}`) };
}

function showFace() {
  facePreview.innerHTML = '';
  if (!faceData) { facePreview.innerHTML = FACE_HINT; return; }
  const img = document.createElement('img');
  img.alt = 'Project image';
  img.src = faceData;
  facePreview.appendChild(img);
}
function resetForm() {
  authorEl.value = ''; titleEl.value = ''; statusEl.value = ''; descEl.value = ''; repoEl.value = '';
  faceInput.value = ''; faceData = ''; facePreview.innerHTML = FACE_HINT;
}
function openAdd() {
  editingId = null;
  resetForm();
  errEl.textContent = '';
  headingEl.textContent = 'Cheers';
  sendBtn.textContent = 'Send';
  const u = getUser();
  if (u && u.alter_ego) authorEl.value = u.alter_ego;
  modal.classList.add('show');
  setTimeout(() => (authorEl.value ? titleEl : authorEl).focus(), 50);
}
function openEdit(p) {
  editingId = String(p.id);
  resetForm();
  errEl.textContent = '';
  headingEl.textContent = 'Edit';
  sendBtn.textContent = 'Save';
  authorEl.value = p.author;
  titleEl.value = p.title;
  statusEl.value = p.status;
  descEl.value = p.description;
  repoEl.value = p.repo;
  faceData = p.face || '';
  showFace();
  modal.classList.add('show');
  setTimeout(() => titleEl.focus(), 50);
}
function closeAdd() { modal.classList.remove('show'); }

// blood spill origin follows cursor — same graphics as #back
let addRaf;
sendBtn.addEventListener('mousemove', (e) => {
  if (addRaf) return;
  addRaf = requestAnimationFrame(() => {
    const r = sendBtn.getBoundingClientRect();
    sendBtn.style.setProperty('--x', ((e.clientX - r.left) / r.width * 100) + '%');
    sendBtn.style.setProperty('--y', ((e.clientY - r.top) / r.height * 100) + '%');
    addRaf = null;
  });
}, { passive: true });

document.getElementById('add-btn').addEventListener('click', openAdd);
document.getElementById('add-cancel').addEventListener('click', closeAdd);
modal.addEventListener('click', (e) => { if (e.target === modal) closeAdd(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAdd(); });

// image picker: preview + downscale to small dataURL (stored in text column)
function readFace(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  img.onload = () => {
    const MAX = 640;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    faceData = c.toDataURL('image/jpeg', 0.72);
    facePreview.innerHTML = '';
    const out = document.createElement('img');
    out.alt = 'Project image';
    out.src = faceData;
    facePreview.appendChild(out);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
}
faceInput.addEventListener('change', () => readFace(faceInput.files[0]));
facePreview.addEventListener('click', () => faceInput.click());
['dragenter', 'dragover'].forEach((ev) => facePreview.addEventListener(ev, (e) => {
  e.preventDefault();
  facePreview.style.borderColor = '#c00000';
}));
['dragleave', 'drop'].forEach((ev) => facePreview.addEventListener(ev, (e) => {
  e.preventDefault();
  facePreview.style.borderColor = '';
}));
facePreview.addEventListener('drop', (e) => {
  const file = e.dataTransfer.files[0];
  if (!file) return;
  readFace(file);
  const dt = new DataTransfer();
  dt.items.add(file);
  faceInput.files = dt.files;
});

function projectCard(p, i, tag) {
  const d = document.createElement('div');
  d.className = 'card';
  d.dataset.live = '';
  const repoLabel = p.repo.replace(/^https?:\/\/(www\.)?github\.com\//i, '');
  const statusClass = p.status.replace(/\s+/g, '-');
  d.innerHTML = `<img class="photo" src="${p.face || 'images/projects-bg.jpg'}" alt="${esc(p.title)}">
      <div class="num">${String(i + 1).padStart(2, '0')}</div>
      <h2>${esc(p.title)}</h2>
      <div class="by">By ${esc(p.author)}</div>
      <p>${esc(p.description)}</p>
      <div class="meta">
        <span class="status ${statusClass}">${esc(p.status)}</span>
        <a class="repo" href="${esc(p.repo)}" target="_blank" rel="noopener noreferrer">${esc(repoLabel)}</a>
      </div>`;
  if (tag && p.owner_tag === tag) {
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'edit-btn';
    edit.textContent = 'Edit';
    edit.setAttribute('aria-label', `Edit ${p.title}`);
    edit.addEventListener('click', () => openEdit(p));
    d.appendChild(edit);
  }
  return d;
}
async function loadProjects() {
  try {
    const keys = await ownerKeys();
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/projects?select=id,author,title,status,description,repo,face,owner_tag,created_at&order=created_at.desc&limit=100`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if (!r.ok) throw new Error(await r.text());
    const list = await r.json();
    grid.querySelectorAll('[data-live]').forEach((el) => el.remove());
    const start = grid.children.length;
    list.forEach((p, i) => grid.appendChild(projectCard(p, start + i, keys && keys.tag)));
  } catch (err) {
    console.warn('projects load failed:', err.message);
  }
}
sendBtn.addEventListener('click', async () => {
  const author = authorEl.value.trim();
  const title = titleEl.value.trim();
  const status = statusEl.value;
  const description = descEl.value.trim();
  let repo = repoEl.value.trim();
  if (!author || !title || !status || !description || !repo) { errEl.textContent = 'All fields required.'; return; }
  if (author.length > 40) { errEl.textContent = 'Author must be 40 chars or less.'; return; }
  if (title.length > 60) { errEl.textContent = 'Title must be 60 chars or less.'; return; }
  if (description.length > 140) { errEl.textContent = 'Description must be 140 chars or less.'; return; }
  if (!/^https?:\/\//i.test(repo)) repo = 'https://' + repo;
  try {
    const u = new URL(repo);
    if (u.protocol !== 'http:' && u.protocol !== 'https:') throw new Error();
  } catch { errEl.textContent = 'Enter a valid repo URL.'; return; }
  const isEdit = editingId !== null;
  sendBtn.disabled = true;
  sendBtn.textContent = isEdit ? 'Saving...' : 'Sending...';
  errEl.textContent = '';
  try {
    const keys = await ownerKeys();
    if (!keys) throw new Error('Log in on the Join page first.');
    const body = { author, title, status, description, repo, face: faceData || null };
    if (!isEdit) { body.owner_token = keys.token; body.owner_tag = keys.tag; }
    const r = await fetch(
      isEdit
        ? `${SUPABASE_URL}/rest/v1/projects?id=eq.${encodeURIComponent(editingId)}&select=id`
        : `${SUPABASE_URL}/rest/v1/projects?select=id`,
      {
        method: isEdit ? 'PATCH' : 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'x-owner-token': keys.token,
          Prefer: 'return=representation'
        },
        body: JSON.stringify(body)
      }
    );
    if (!r.ok) throw new Error(await r.text());
    const rows = await r.json();
    if (isEdit && !rows.length) throw new Error('Not allowed to edit this project.');
    resetForm();
    editingId = null;
    closeAdd();
    await loadProjects();
  } catch (err) {
    errEl.textContent = 'Failed: ' + err.message.slice(0, 200);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = editingId ? 'Save' : 'Send';
  }
});
loadProjects();
</script>
<script>
document.getElementById('back').addEventListener('click', () => {
  window.location.href = 'strong_people.html#projects-banner';
});
</script>
<script src="script.js"></script>
<div id="mobile-block" aria-hidden="true"><img src="images/instead.jpg" alt=""><p>Instead use your laptop, Noob!</p></div></body>
</html>
