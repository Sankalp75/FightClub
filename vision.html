<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #050505;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #050505 url('images/vision-bg.jpg') center center / cover no-repeat;
      filter: blur(10px);
      transform: scale(1.05);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.60) 40%, rgba(0,0,0,0.82) 100%);
    }
    header, #grid { position: relative; z-index: 1; }
    #grid .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
      padding: 0 0 2em;
      overflow: hidden;
    }
    #grid .card:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.12); }
    #grid .card .photo {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: center;
      display: block;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    #grid .card .num { margin-top: 1.6em; }
    #grid .card h2, #grid .card p { padding-left: 1.8em; padding-right: 1.8em; }
  </style>
</head>
<body>
  <button id="back">Back</button>
  <header>
    <h1>Vision</h1>
  </header>
  <main id="grid">
    <div class="card"><img class="photo" src="images/vision-bg.jpg" alt="Awake"><div class="num">01</div><h2>Awake</h2><p>"See the lie. The job, the debt, the feed — all anesthesia. Wake up or stay numb."</p></div>
  </main>
<script>
document.getElementById('back').addEventListener('click', () => {
  window.location.href = 'strong_people.html#vision-banner';
});
</script>
<script src="script.js"></script>
<div id="mobile-block" aria-hidden="true"><img src="images/instead.jpg" alt=""><p>Instead use your laptop, Noob!</p></div></body>
</html>
