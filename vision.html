<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #050505;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #050505 url('images/vision-bg.jpg') center center / cover no-repeat;
      filter: blur(10px);
      transform: scale(1.05);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.60) 40%, rgba(0,0,0,0.82) 100%);
    }
    header, #grid { position: relative; z-index: 1; }
    #grid .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
      padding: 0 0 2em;
      overflow: hidden;
    }
    #grid .card:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.12); }
    #grid .card .photo {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: center;
      display: block;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    #grid .card .num { margin-top: 1.6em; }
    #grid .card h2, #grid .card p { padding-left: 1.8em; padding-right: 1.8em; }
    /* ── vision cards: message small, wrapped in two big quotes ── */
    #grid .card .speech-text { font-size: 12px; line-height: 1.8; }
    #grid .card .speech-text .q {
      display: block;
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: 44px;
      line-height: 0.6;
      letter-spacing: 0;
      color: rgba(255,255,255,0.85);
      margin: 0.35em 0 0.15em;
    }
    #grid .card .speech-text .q:last-child { margin: 0.25em 0 0; }
  </style>
</head>
<body>
  <button id="back">Back</button>
  <button id="add-btn">Cheers</button>
  <header>
    <h1>Vision</h1>
  </header>
  <main id="grid">
  </main>
  <div id="add-modal" aria-hidden="true">
    <div id="add-box" role="dialog" aria-label="Add your vision">
      <h2>Cheers</h2>
      <p class="sub">Visible for 7 days. No edits. No mercy.</p>
      <label for="add-face">Your face</label>
      <div id="add-face-preview">Drop your face<br>or click to add</div>
      <input id="add-face" type="file" accept="image/*" hidden>
      <label for="add-name">Name</label>
      <input id="add-name" type="text" maxlength="40" placeholder="Tyler Durden" autocomplete="off">
      <label for="add-message">Vision</label>
      <textarea id="add-message" maxlength="500" placeholder="What do you see..."></textarea>
      <div class="row">
        <button id="add-cancel" type="button">Cancel</button>
        <button id="add-send" type="button">Send</button>
      </div>
      <div id="add-err"></div>
    </div>
  </div>
<script>
// ── Vision board (Supabase: visions table, 7-day expiry) ──
// Run ONCE in Supabase → SQL Editor (table + policies):
//   create table visions (
//     id bigserial primary key,
//     name text not null,
//     message text not null,
//     face text,
//     created_at timestamptz default now(),
//     expires_at timestamptz default (now() + interval '7 days')
//   );
//   alter table visions enable row level security;
//   create policy "allow anon insert" on visions
//     for insert to anon with check (true);
//   create policy "allow anon read" on visions
//     for select to anon using (true);
const SUPABASE_URL = 'https://afdrdgtcynnotokghvxh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZHJkZ3RjeW5ub3Rva2dodnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDkxMzYsImV4cCI6MjEwNTMyNTEzNn0.3dfMs3vrwvtyYY5QmDKNZxwwm9RlOfAyfBJXaEMN3yk';
const VISION_TTL_MS = 7 * 24 * 60 * 60 * 1000;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const grid = document.getElementById('grid');
const modal = document.getElementById('add-modal');
const nameEl = document.getElementById('add-name');
const msgEl = document.getElementById('add-message');
const errEl = document.getElementById('add-err');
const sendBtn = document.getElementById('add-send');
const FACE_HINT = 'Drop your face<br>or click to add';

function openAdd() {
  errEl.textContent = '';
  try {
    const u = JSON.parse(localStorage.getItem('hustle_user') || 'null');
    if (u) {
      if (u.alter_ego && !nameEl.value) nameEl.value = u.alter_ego;
      if (u.face && !faceData) {
        faceData = u.face;
        facePreview.innerHTML = '';
        const img = document.createElement('img');
        img.alt = 'Your face';
        img.src = u.face;
        facePreview.appendChild(img);
      }
    }
  } catch {}
  modal.classList.add('show');
  setTimeout(() => (nameEl.value ? msgEl : nameEl).focus(), 50);
}
function closeAdd() { modal.classList.remove('show'); }

// blood spill origin follows cursor — same graphics as #back
let addRaf;
sendBtn.addEventListener('mousemove', (e) => {
  if (addRaf) return;
  addRaf = requestAnimationFrame(() => {
    const r = sendBtn.getBoundingClientRect();
    sendBtn.style.setProperty('--x', ((e.clientX - r.left) / r.width * 100) + '%');
    sendBtn.style.setProperty('--y', ((e.clientY - r.top) / r.height * 100) + '%');
    addRaf = null;
  });
}, { passive: true });

document.getElementById('back').addEventListener('click', () => {
  window.location.href = 'strong_people.html#vision-banner';
});
document.getElementById('add-btn').addEventListener('click', openAdd);
document.getElementById('add-cancel').addEventListener('click', closeAdd);
modal.addEventListener('click', (e) => { if (e.target === modal) closeAdd(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAdd(); });

// face picker: preview + downscale to small dataURL (stored in text column)
const faceInput = document.getElementById('add-face');
const facePreview = document.getElementById('add-face-preview');
let faceData = '';
function readFace(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  img.onload = () => {
    const MAX = 640;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    faceData = c.toDataURL('image/jpeg', 0.72);
    facePreview.innerHTML = '';
    const out = document.createElement('img');
    out.alt = 'Your face';
    out.src = faceData;
    facePreview.appendChild(out);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
}
faceInput.addEventListener('change', () => readFace(faceInput.files[0]));
facePreview.addEventListener('click', () => faceInput.click());
['dragenter', 'dragover'].forEach((ev) => facePreview.addEventListener(ev, (e) => {
  e.preventDefault();
  facePreview.style.borderColor = '#c00000';
}));
['dragleave', 'drop'].forEach((ev) => facePreview.addEventListener(ev, (e) => {
  e.preventDefault();
  facePreview.style.borderColor = '';
}));
facePreview.addEventListener('drop', (e) => {
  const file = e.dataTransfer.files[0];
  if (!file) return;
  readFace(file);
  const dt = new DataTransfer();
  dt.items.add(file);
  faceInput.files = dt.files;
});

function visionCard(s, i) {
  const d = document.createElement('div');
  d.className = 'card';
  const photo = s.face
    ? `<img class="photo" src="${s.face}" alt="${esc(s.name)}">`
    : `<img class="photo" src="images/vision-bg.jpg" alt="${esc(s.name)}">`;
  d.innerHTML = `${photo}
      <div class="num">${String(i + 1).padStart(2, '0')}</div>
      <h2>${esc(s.name)}</h2>
      <p class="speech-text"><span class="q">&ldquo;</span>${esc(s.message)}<span class="q">&rdquo;</span></p>`;
  return d;
}
function renderVisions(list) {
  grid.replaceChildren();
  const now = Date.now();
  list
    .filter((s) => now - new Date(s.created_at).getTime() < VISION_TTL_MS)
    .forEach((s, i) => grid.appendChild(visionCard(s, i)));
}
async function loadVisions() {
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/visions?select=name,message,face,created_at&order=created_at.desc&limit=100`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if (!r.ok) throw new Error(await r.text());
    renderVisions(await r.json());
  } catch (err) {
    console.warn('visions load failed:', err.message);
  }
}
sendBtn.addEventListener('click', async () => {
  const name = nameEl.value.trim();
  const message = msgEl.value.trim();
  if (!name || !message) { errEl.textContent = 'Name and message required.'; return; }
  if (name.length > 40) { errEl.textContent = 'Name must be 40 chars or less.'; return; }
  if (message.length > 500) { errEl.textContent = 'Message must be 500 chars or less.'; return; }
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending...';
  errEl.textContent = '';
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/visions`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ name, message, face: faceData || null })
    });
    if (!r.ok) throw new Error(await r.text());
    nameEl.value = ''; msgEl.value = ''; faceInput.value = ''; faceData = '';
    facePreview.innerHTML = FACE_HINT;
    closeAdd();
    await loadVisions();
  } catch (err) {
    errEl.textContent = 'Failed: ' + err.message.slice(0, 200);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
  }
});
loadVisions();
</script>
<script src="script.js"></script>
<div id="mobile-block" aria-hidden="true"><img src="images/instead.jpg" alt=""><p>Instead use your laptop, Noob!</p></div></body>
</html>
