<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weak People</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #050505;
    }
    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: blur(10px);
    }
    #title {
      z-index: 3;
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: clamp(28px, 5vw, 90px);
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.9);
      text-align: center;
      padding: 0.6em 1.2em;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
<div id="scene">
  <img class="layer" src="images/princes.jpg" alt="">
  <div id="title">Sorry, This World is not for you princess</div>
  <button id="back">Back to landing</button>
</div>
<script>
document.getElementById('back').addEventListener('click', () => {
  window.location.href = 'index.html';
});
</script>
<script src="script.js"></script>
<div id="mobile-block" aria-hidden="true"><img src="images/instead.jpg" alt=""><p>Instead use your laptop, Noob!</p></div></body>
</html>
