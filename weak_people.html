<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weak People</title>
  <style>
    @font-face {
      font-family: 'FightThis';
      src: url('FightThis.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #050505;
    }
    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: blur(10px);
    }
    #title {
      z-index: 3;
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: clamp(28px, 5vw, 90px);
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.9);
      text-align: center;
      padding: 0.6em 1.2em;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }
    #back {
      position: absolute;
      left: 3vw;
      top: 3vh;
      z-index: 8;
      font-family: 'FightThis', 'Arial Narrow', sans-serif;
      font-size: clamp(14px, 1.4vw, 24px);
      letter-spacing: 0.12em;
      background: #fff;
      border: 1px solid #fff;
      color: #000;
      padding: 0.4em 1.2em;
      cursor: pointer;
      overflow: hidden;
      isolation: isolate;
      --x: 50%; --y: 50%;
      transform: translateZ(0);
      transition: border-color 0.35s ease;
    }
    #back::before {
      content: "";
      position: absolute;
      width: 300%;
      aspect-ratio: 1;
      left: var(--x);
      top: var(--y);
      background: #c00000;
      border-radius: 50%;
      z-index: -1;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 2.70s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      pointer-events: none;
    }
    #back:hover::before {
      transform: translate(-50%, -50%) scale(1);
    }
    #back:hover {
      border-color: #c00000;
      color: #000;
    }
    #mobile-block { display:none; position:fixed; inset:0; z-index:99999; align-items:center; justify-content:center; overflow:hidden; background:#050505; }
    #mobile-block img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(14px) brightness(0.55); transform:scale(1.06); }
    #mobile-block p { position:relative; z-index:1; font-family:'FightThis','Arial Narrow',sans-serif; font-size:clamp(28px,7vw,56px); letter-spacing:0.12em; color:rgba(255,255,255,0.92); text-align:center; padding:0 6vw; line-height:1.2; text-shadow:0 2px 20px rgba(0,0,0,0.9); }
    @media (max-width:768px) { #mobile-block { display:flex; } }
  </style>
</head>
<body>
<div id="scene">
  <img class="layer" src="images/princes.png" alt="">
  <div id="title">Sorry, This World is not for you princess</div>
  <button id="back">Back to landing</button>
</div>
<script>
const backBtn = document.getElementById('back');
backBtn.addEventListener('click', () => {
  window.location.href = 'fightclub_landing.html';
});
let raf;
backBtn.addEventListener('mousemove', e => {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    const r = backBtn.getBoundingClientRect();
    backBtn.style.setProperty('--x', ((e.clientX - r.left)/r.width*100)+'%');
    backBtn.style.setProperty('--y', ((e.clientY - r.top)/r.height*100)+'%');
    raf = null;
  });
}, {passive: true});
</script>
<div id="mobile-block" aria-hidden="true"><img src="images/instead.jpg" alt=""><p>Instead use your laptop, Noob!</p></div></body>
</html>
